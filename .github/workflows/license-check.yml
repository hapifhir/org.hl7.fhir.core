# This workflow runs the license-maven-plugin to collect the licenses of compiled and runtime dependencies in all this
# project's modules, and fails the build if any dependency's license is not on the allowlist declared in the
# LICENSE_CHECK profile in the root pom.xml. It will ignore test and provided dependencies.
#
# See src/license/README.md for the license policy and how to run this locally.

name: License Check

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:


permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Only read access to repository contents
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build modules
        run: mvn clean install -DskipTests
      - name: Check dependency licenses
        run: mvn -PLICENSE_CHECK license:aggregate-add-third-party
